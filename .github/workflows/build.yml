name: Build WROVER info

on:
  workflow_dispatch:
  push:
    paths:
      - 'wrover_info/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile (ESP32 Wrover Module)
        run: arduino-cli compile --fqbn esp32:esp32:esp32wrover --export-binaries wrover_info

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wrover_info_firmware
          path: wrover_info/build/esp32.esp32.esp32wrover/*.merged.bin
